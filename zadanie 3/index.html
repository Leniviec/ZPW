<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>zadanie3 wprowadzenie jquery</title>
        <script
  src="https://code.jquery.com/jquery-4.0.0.min.js"
  integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
  crossorigin="anonymous"></script>
  <script>
    $(function(){
        $("#test").on("click", function(){
            console.log("Nasz event")
        })
        $("#test").click(function(){
            console.log("Nasz event 2 ")
        })
        $("#czesc").on("click", function(){
           $("#komunikat").prepend().text("hello");
        })
        $("#kwadrat").click(function(){
            $(this).css("background-color","red");
        })

        $("#resetuj").click(funciton(){
            $("#kwadrat").css("background-color","grey");
            $("#komunikat").text() = "";
        })

        let licznik = 0;
        $("#kwadrat").click(function(){
            licznik++;
            $("p").text() = "Kliknięto" + licznik + "razy";
        })
    })
  </script>
  <style>
    #kwadrat { width: 150px; height: 150px; background: lightgray; }
  </style>
</head>
<body>
<button id="test">Test</button>
<button id="czesc">Przywitaj się</button>
<p id="komunikat"></p>
 
<div id="kwadrat"></div>
 <button id="resetuj">reset</button>
</body>
</html>
