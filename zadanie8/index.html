<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jquery</title>
    <script
  src="https://code.jquery.com/jquery-4.0.0.min.js"
  integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
  crossorigin="anonymous"></script>
  <script>
    $(function(){
        $("#formularz").submit(function(e){
            e.preventDefault()
            if($("#nick").val() == ""){
                $("#info").text("Podaj nick!")
            } else {
                $("#info").text("Wysłano!")
            }
        })
            $("#formularz").submit(function(e){
            e.preventDefault()
            if($("#haslo").val().length >= 6){
                $("#inf").text("Zalogowano!").css("color","green")
            } else {
                $("#inf").text("Hasło jest za krótkie!").css("color","red")
            }
        })
        $("#kolor").change(function(){
            $("body").css("background-color", $(this).val())
        })
        $("#rozmiar").change(function(){
            $("#dozap").text("do zapłaty " + $(this).val())
        })
    })
  </script>
   </head>
   <style>
    body{
        padding: 20px;
        background-color: white;
    }
   </style>
  <body>
    <form id="formularz">
        Nick:<input type="text" id="nick">
        <button type="submit">Wyślij</button>
    <p id="info"></p>
    <hr>
    email:<input type="email" id="email"></br>
    haslo:<input type="password" id="haslo"></br>
    <button type="submit" id="zaloguj">zaloguj</button></br>
    <p id="inf"></p>
    <hr>
    <select id="kolor">
        <option value="white">biały</option>
        <option value="purple">fioletowy</option>
        <option value="lightgreen">r34</option>
        <option value="lightblue">niebieski</option>
    </select>
    <hr>
    Rozmiar pizzy:
    <select id="rozmiar">
        <option value="20zl">mała </option>
        <option value="30zl">średnia</option>
        <option value="40zl">duży</option>
    </select>
    <p id="dozap"></p>
    </form>
  </body>
  </html>
