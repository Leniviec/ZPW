<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jquery</title>
    <script
  src="https://code.jquery.com/jquery-4.0.0.min.js"
  integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
  crossorigin="anonymous"></script>
  <script>
    $(function(){
        $("#sprawdz").click(function(){
            if($("#tekst").val().trim() === ""){
                $("#komunikat").text("to pole jest puste!")
            } else {
                $("#komunikat").text($("#tekst").val())
            }
        })
        $("#wyslij").click(function(){
            if($("#nazwisko").val().trim() === ""){
                $("#info").text("Podaj nazwisko!").css("color","red")
            } else {
                $("#info").text("Wysłano formularz!").css("color","green")
            }
        })
        $("#sprawdzwiek").click(function(){
            let wiek = $("#wiek").val();
            if(isNaN(wiek)){
                $("#blad").text("Wiek musi byc liczbą")
            } else {
                $("#blad").text("Masz " + wiek + " lat.")
            }
        })
        $("#zapisz").click(function(){
            let ocena = $("#ocena").val();
            if(isNaN(ocena)){
                $("#zle").text("Ocena musi byc liczbą")
            } else if(ocena < 1 || ocena > 6 ){
                $("#zle").text("ocena musi byc 1-6.")
            } else {
                $("#zle").text("Zapisano ocene: " + ocena)
            }
        })
    })
  </script>
   </head>
   <style>

   </style>
  <body>
        <input type="text" id="tekst">
        <input type="button" id="sprawdz" value="check">
        <p id="komunikat"></p>
    <hr>
        <input type="text" id="nazwisko">
        <input type="button" id="wyslij" value="wyslij">
        <p id="info"></p>
    <hr>
        <input type="text" id="wiek">
        <button id="sprawdzwiek">Sprawdź</button>
        <p id="blad"></p>
    <hr>
        <input type="text" id="ocena">
        <button id="zapisz">Zapisz</button>
        <p id="zle"></p>
  </body>
  </html>
